[package]
name = "coral-extension"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Coral language support for Zed"
repository = "https://github.com/coralc-lang/coral-zed"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true